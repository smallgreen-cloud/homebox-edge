name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Worker bindings
        run: npx wrangler types

      - name: Run unit and Worker integration tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check generated Worker bindings
        run: npx wrangler types --check

      - name: Build the production Worker
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Open or update CI failure alert
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "CI failure: HomeBox Edge quality gate";
            const body = [
              `Workflow: ${context.workflow}`,
              `Ref: ${context.ref}`,
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
